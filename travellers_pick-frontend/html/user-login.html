<!DOCTYPE html>
<html>

<head>
  <title>Login</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="tourism details">
  <meta name="keywords" content="tour,tourism,travel and tourism">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" rel="stylesheet" />

  <link rel="icon" type="image/png" href="../img/userlogin-icon.png">
  <link rel="stylesheet" type="text/css" href="../css/index.css">
  <link rel="stylesheet" type="text/css" href="../css/userlogin.css">
</head>

<body>

  <div id="container">
    <div class="content">
      <h1>Welcome Back, Traveller!</h1>
      <h4>Continue your travel journey.</h4>
    </div>

    <form id="login-form">

      <h1 class="heading">LOGIN</h1>
      <div class="txt">
        <input type="email" id="email" name="email" placeholder="alex@email.com" autocomplete="off">
      </div>

      <div class="txt">
        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="off">
      </div>

      <div class="button-group">
        <input type="submit" value="LOGIN" class="button" />
        <input type="reset" value="RESET" class="button" />
      </div>

      <p class="already">Doesn't have an Account? <a href='../html/user-signup.html'>SignUp</a></p>
      <p id="error"></p>
    </form>
  </div>

  <script src="../js/config.js"></script>
  <script type="module" src="../js/userlogin.js"></script>
  <script type="module" src="../js/error.js"></script>
</body>

</html>
