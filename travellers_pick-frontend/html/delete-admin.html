<!DOCTYPE html>
<html>
<head>
	<title>Delete Admin</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link
		href='http://fonts.googleapis.com/css?family=Lato:100,300,400,700,900,100italic,300italic,400italic,700italic,900italic'
		rel='stylesheet' type='text/css'>
	<link href="style.css" rel="stylesheet" type="text/css" />
	<link href="../css/style.css" rel="stylesheet" type="text/css" media="all" />
	<link rel="stylesheet" href="../css/user.css" type="text/css">
	<link rel="icon" type="image/png" href="../img/userlogin-icon.png">

</head>

<body>
	<div class="container">
		<form id="delAdmin">
			<input type="hidden" name="_method" value="DELETE">
			<legend>DELETE ADMIN</legend>
			<label for="adminId">Admin ID</label>
			<input type="text" name="adminId" id="adminId" placeholder="Admin ID" required><br><br>
			<label for="password">Password</label>
			<input type="password" name="password" id="password" placeholder="Password" required>
			<input type="submit" value="DELETE" name="submit" class="button" />
			<input type="reset" value="RESET" name="reset" class="button" />
		</form>
		<p id="deleteadmin"></p>
	</div>

	<script src="../js/deleteadmin.js"></script>
</body>

</html>
