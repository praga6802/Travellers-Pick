<!DOCTYPE html>
<html>

<head>
  <title>Sign Up</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="tourism details">
  <meta name="keywords" content="tour,tourism,travel and tourism">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" rel="stylesheet" />

  <link rel="stylesheet" type="text/css" href="../css/usersignup.css">
  <link href="../css/index.css" type="text/css" rel="stylesheet">
  <link rel="icon" type="image/png" href="../img/userlogin-icon.png">
</head>

<body>

  <div id="container">
    <div class="content">
      <h1>Join Traveller's Pick</h1>
      <h4>Sign up and explore the world with Travellers Pick.</h4>
    </div>

    <form id="signup-form">
      <h1 class="heading">SIGN UP</h1>
      <div class="txt">
        <input type="text" id="username" name="username" placeholder="Enter your full name" autofocus required autocomplete="name">
      </div>

      <div class="txt">
        <input type="email" id="email" name="email" placeholder="Email" autocomplete="email">
      </div>

      <div class="txt">
        <input type="password" id="password" name="password" placeholder="Password" required autocomplete="new-password">
      </div>

      <div class="txt">
        <input type="tel" id="contact" name="contact" placeholder="10-digit mobile number" pattern="[0-9]{10}" required autocomplete="tel">
      </div>

      <div class="button-group">
        <input type="submit" value="SUBMIT" class="button" />
        <input type="reset" value="RESET" class="button" />
      </div>

      <p class="already">Already have an Account? <a href='../html/user-login.html'>Login</a></p>
      <p id="error"></p>
    </form>
  </div>

  <script type="module" src="../js/config.js"></script>
  <script type="module" src="../js/usersignup.js"></script>
  <script type="module" src="../js/error.js"></script>
</body>

</html>
