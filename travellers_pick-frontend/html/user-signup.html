<!DOCTYPE html>
<html>

<head>
  <title>User SignUp</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="tourism details">
  <meta name="keywords" content="tour,tourism,travel and tourism">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" rel="stylesheet" />

  <link rel="stylesheet" type="text/css" href="../css/usersignup.css">
  <link href="../css/index.css" type="text/css" rel="stylesheet">
  <link rel="icon" type="image/png" href="../img/userlogin-icon.png">
</head>

<body>

  <main>
    <div class="container">
      <div class="row">
        <div class="col-12 col-md-6 content">
          <h1>Join Traveller's Pick</h1>
          <h4>Sign up and explore the world with Travellers Pick.</h4>
        </div>

        <div class="col-12 col-md-6">
          <form id="signup-form">
            <h1 class="heading">SIGN UP</h1>
            <div class="txt">
              <input type="text" id="username" name="username" placeholder="Enter your full name" autofocus required
                autocomplete="name">
            </div>

            <div class="txt">
              <input type="email" id="email" name="email" placeholder="Email" autocomplete="email">
            </div>

            <div class="txt">
              <input type="password" id="password" name="password" placeholder="Password" required
                autocomplete="new-password">
            </div>

            <div class="txt">
              <input type="tel" id="contact" name="contact" placeholder="10-digit mobile number" pattern="[0-9]{10}"
                required autocomplete="tel">
            </div>

            <div class="button-group">
              <input type="submit" value="SUBMIT" class="button" />
              <input type="reset" value="RESET" class="button" />
            </div>

            <p class="already">Already have an Account? <a href='../html/user-login.html'>Login</a></p>
            <p id="form-error"></p>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="../js/config.js"></script>
  <script type="module" src="../js/usersignup.js"></script>
  <script type="module" src="../js/error.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
